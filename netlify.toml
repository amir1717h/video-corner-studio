[build]
  command = "npm install && node scripts/copy-ffmpeg.mjs"
  publish = "public"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/core/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/vendor/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
